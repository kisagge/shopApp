<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PLAIN">
  <!--
    브라우저 탭 아이콘.

    글자를 <text> 로 그리지 않고 **패스로 그린다.** 파비콘을 그리는 쪽에
    Hahmlet 이 있을 리 없고, 없으면 시스템 기본 글꼴로 대체돼 브랜드와
    다른 모양이 나온다. 패스는 어디서 그리든 같다.

    **하나의 패스로 그린다.** 세로 획과 볼을 따로 두었더니 둘이 만나는
    자리에 머리카락 같은 틈이 보였다 — 경계에서 안티에일리어싱이 각각
    적용되기 때문이다. 이어 그리면 그 자리가 없어진다.

    16px 에서도 읽혀야 하므로 획을 두껍게 잡고 여백을 넉넉히 뒀다.
  -->
  <rect width="32" height="32" rx="7" fill="#181613"/>
  <path d="M10.5 7h6.2a5.2 5.2 0 0 1 0 10.4h-2.6V25h-3.6Z" fill="#fefdfc"/>
</svg>
