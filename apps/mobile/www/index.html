<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PLAIN</title>
<!--
  네트워크가 없을 때 나오는 화면.

  server.url 로 원격을 띄우는 셸이라 평소에는 이 파일이 보이지 않는다.
  하지만 연결이 안 되면 웹뷰는 **아무것도 없는 흰 화면**을 남기고,
  사용자는 앱이 고장 난 줄 안다. 그 자리를 메우는 것이 전부다.

  바깥에서 아무것도 불러오지 않는다 — 연결이 없을 때 보여 줄 화면이
  연결을 필요로 하면 뜻이 없다. 글꼴도 시스템 것을 쓴다.

  **문구도 같은 이유로 여기 박혀 있다.** 사전은 서버 쪽에 있고, 이 화면이
  뜨는 상황은 바로 그 서버에 닿지 못하는 상황이다. 그래서 세 말을 아래
  스크립트에 그대로 적고 기기 언어로 고른다.
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
    background: #fdfcfa;
    color: #2b2926;
    font: 15px/1.7 -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1a1917; color: #eeece8; }
    .hint { color: #9a958d; }
    button { background: #eeece8; color: #1a1917; }
  }
  main { max-width: 320px; text-align: center; display: flex; flex-direction: column; gap: 14px; }
  /* 아직 끊겨 있을 때 단추가 눌린 티를 내는 흔들림 */
  @keyframes nudge {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    @keyframes nudge { 0%, 100% { transform: none; } }
  }
  h1 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: 0.16em; }
  p { margin: 0; font-size: 14px; }
  .hint { color: #6f6a63; font-size: 13px; }
  button {
    margin-top: 10px;
    height: 48px;
    border: 0;
    border-radius: 4px;
    background: #2b2926;
    color: #fdfcfa;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
</style>
</head>
<body>
  <main>
    <h1>PLAIN</h1>
    <p id="title">연결할 수 없습니다.</p>
    <p class="hint" id="hint">네트워크 상태를 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" id="retry">다시 시도</button>
  </main>

<script>
  /*
   * 기기 언어로 문구를 고른다.
   *
   * 웹뷰는 기기 언어를 그대로 navigator.languages 에 넣어 준다 — 평소 화면이
   * Accept-Language 로 받는 것과 같은 값이다. 여기서는 헤더가 없으니 그 배열을
   * 직접 본다.
   *
   * **쿠키는 보지 않는다.** 이 파일은 앱 안에 들어 있어 원격 주소와 출처가
   * 달라서, 사용자가 웹에서 고른 말이 여기에는 오지 않는다.
   *
   * 기본은 한국어다. 이 가게는 한국 가게이고, 못 고른 상태로 빈 화면을 두는
   * 것보다 한 말로라도 보여 주는 편이 낫다.
   */
  (function () {
    var TEXT = {
      ko: {
        title: '연결할 수 없습니다.',
        hint: '네트워크 상태를 확인한 뒤 다시 시도해 주세요.',
        retry: '다시 시도',
        lang: 'ko-KR'
      },
      en: {
        title: "Can't connect.",
        hint: 'Check your network connection and try again.',
        retry: 'Try again',
        lang: 'en-US'
      },
      ja: {
        title: '接続できません。',
        hint: 'ネットワーク接続を確認してからもう一度お試しください。',
        retry: '再試行',
        lang: 'ja-JP'
      }
    };

    var wanted = navigator.languages || [navigator.language || ''];
    var pick = 'ko';
    for (var i = 0; i < wanted.length; i += 1) {
      // ja-JP 는 ja 로 맞춘다. 지역까지 같은 태그만 받으면 대부분이 걸러진다.
      var base = String(wanted[i] || '').toLowerCase().split('-')[0];
      if (TEXT[base]) { pick = base; break; }
    }

    var t = TEXT[pick];
    document.documentElement.lang = t.lang;
    document.getElementById('title').textContent = t.title;
    document.getElementById('hint').textContent = t.hint;
    document.getElementById('retry').textContent = t.retry;

    /*
     * **여기서도 시작 화면을 내린다.**
     *
     * 이 화면이 뜨는 상황은 웹앱이 못 온 상황이라, 웹이 내려 주기를 기다릴
     * 수 없다. 그대로 두면 상한(6초)이 지날 때까지 "연결할 수 없습니다" 가
     * 시작 화면에 가려 보이지 않는다 — 정작 사용자에게 할 말이 있는 화면인데.
     */
    var splash = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.SplashScreen;
    if (splash) { try { splash.hide({ fadeOutDuration: 200 }); } catch (e) {} }

    /*
     * **연결이 돌아오면 스스로 들어간다.**
     *
     * 비행기 모드를 끄거나 와이파이가 잡히는 것은 사용자가 이 화면을 보고
     * 있는 동안 일어난다. 그런데 예전에는 단추를 눌러야만 다시 시도해서,
     * 연결이 이미 돌아왔는데도 앱은 계속 "연결할 수 없습니다" 를 띄우고
     * 있었다. 기다리게 할 이유가 없다.
     */
    window.addEventListener('online', function () { location.reload(); });

    /*
     * 아직 끊긴 채로 누르면 **눌린 티를 낸다.**
     *
     * 그대로 새로고침하면 같은 화면이 다시 그려지는데, 화면이 안 바뀌니
     * 사용자는 단추가 고장 난 줄 안다. 한 번 흔들어 "눌리긴 했고 아직
     * 안 된다" 를 말한다.
     */
    document.getElementById('retry').addEventListener('click', function () {
      if (navigator.onLine === false) {
        var main = document.querySelector('main');
        main.style.animation = 'none';
        void main.offsetWidth;
        main.style.animation = 'nudge .3s';
        return;
      }
      location.reload();
    });
  })();
</script>
</body>
</html>
