packages:
  - apps/*
  - packages/*

# pnpm은 postinstall 스크립트를 기본 차단한다. 공급망 공격 표면이라
# 실제로 필요한 것만 이름을 적어 허용한다.
allowBuilds:
  prisma: true
  '@prisma/engines': true
  esbuild: true

minimumReleaseAgeExclude:
  - '@next/env@16.3.8'
  - '@next/swc-darwin-arm64@16.3.8'
  - '@next/swc-darwin-x64@16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.8'
  - '@next/swc-linux-x64-musl@16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.8'
  - next@16.3.8

# 전이 의존을 올려 권고를 지우는 자리.
#
# **고칠 수 있으면 올린다**(tooling/audit.mjs 의 규칙). undici 는 jsdom·vitest 아래에만 있는
# 검사용 의존인데, 올려서 지울 수 있는 것을 허용 목록에 적어 두면 목록이 "못 고치는 것" 이
# 아니라 "안 고친 것" 으로 채워진다. jsdom 이 ^8.9.0 을 받으므로 올려도 범위 안이다.
overrides:
  undici: '^8.12.2'
  # URI 를 해석하는 자리의 권고가 넷으로 늘었다(스킴 위장·호스트 혼동이 뒤에 붙었다). 넷 다 3.1.9 에서
  # 고쳐졌다. ajv 가 ^3.0.1 을 받으므로 3.x 안에 머문다 — 4.x 로 올리면 ajv 가 못 받는다
  # (Prisma CLI 가 그 ajv 를 쓴다).
  fast-uri: '^3.1.9'
  # 재귀·확장이 폭발하는 DoS 셋(GHSA-q2hr·qhr7·6j4f). 두 갈래가 함께 깔려 있다 — 옛 minimatch(3.x)가 1.x,
  # eslint 쪽 minimatch(10.x)가 5.x 를 받는다. 갈래마다 고쳐진 가장 낮은 버전으로 올린다: 한쪽으로 몰면
  # minimatch 가 못 받는다.
  brace-expansion@1: '^1.1.21'
  brace-expansion@>=4: '^5.0.12'
  # librsvg 의 CVE-2026-96889(GHSA-wq5f-xc86-pv6w). 우리는 sharp 를 직접 올렸지만 next 아래로도 깔린다 —
  # 이미지 변환은 요청 경로에서 도는 일이라(업로드 다듬기·og 이미지) 거기까지 같은 버전으로 맞춘다.
  sharp: '^0.35.5'
  # 구간 오프셋으로 이벤트 루프를 멈추는 DoS(GHSA-68fv-2mgg-jv7q). postcss·tailwind·vite 아래에만 있는
  # 빌드 도구인데, 받는 범위가 ^1.0.0 이라 올려도 그 안이다.
  source-map-js: '^1.2.2'
  # launch-editor 권고 셋(GHSA-698v·r825·587h). 셋 다 vite **개발 서버**의 "편집기에서 열기" 통로에서
  # 나는 것이고 둘은 Windows 전용인데, 고쳐진 판이 있으면 올린다는 것이 이 저장소의 규칙이다.
  # vitest 가 받는 범위(^8.0.0)에 8.2.4 가 드는데도 `pnpm update vite` 는 8.2.2 에 머물렀다 —
  # 전이 의존은 잠금 파일의 결정을 그대로 쓴다. 그래서 판을 여기서 적는다.
  vite: '^8.2.4'
