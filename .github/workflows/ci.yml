name: CI

# **손으로만 돌린다.**
#
# 이 저장소는 비공개라 Actions 가 분당 과금이고, 한 실행이 Postgres 를 띄워
# 린트·타입체크·빌드·단위검사·E2E 를 전부 돈다 — 무료 한도를 금방 먹는다.
# 그래서 push/pull_request 자동 실행을 껐다.
#
# **대신 `pnpm ci:local` 이 문지기다.** 그 스크립트는 여기와 같은 순서로
# 같은 것을 돌리고 일회용 DB 까지 새로 만든다(tooling/ci-local.sh). 푸시 전에
# 그것을 돌리는 것이 규칙이다 — 안 돌리면 아무도 안 본 코드가 그대로 배포된다.
#
# **배포는 이것과 무관하다.** Vercel 이 Git 연동으로 직접 빌드하므로 이 워크플로를
# 꺼도 푸시하면 배포된다. 바꿔 말하면 여기서 막아 주는 것이 없다는 뜻이다.
#
# 되돌리려면 아래 두 줄의 주석을 풀면 된다.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:
  #   branches: [main]

# 같은 브랜치에 연속으로 돌리면 이전 실행을 취소한다 — 프라이빗 저장소는 분당 과금이다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1
  # 위 services 의 Postgres. 실행마다 새로 뜨는 일회용이라 자격 증명이
  # 고정값이어도 된다 — 어디에도 남지 않고 밖에서 닿을 수도 없다.
  DATABASE_URL: postgresql://shop:shop@localhost:5432/shop
  # 실행마다 새로 만든다. 세션 서명에만 쓰이고 실행이 끝나면 사라진다.
  BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000

jobs:
  verify:
    name: 린트 · 타입체크 · 테스트 · 빌드 · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # E2E 는 목이 아니라 **진짜 DB** 를 거쳐야 의미가 있다.
    # 목 위에서 도는 검사는 이미 단위 테스트가 1,100개 넘게 하고 있다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: pnpm 설치
        uses: pnpm/action-setup@v6
        # 버전은 package.json 의 packageManager 필드를 따른다

      - name: Node 설치
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: Turbo 캐시 복원
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # **DB 를 검사보다 먼저 준비한다.**
      #
      # 빌드가 DB 를 친다 — 루트 레이아웃의 푸터가 카테고리를 읽어서, 정적으로
      # 미리 그리는 화면(/cart · /_not-found)이 프리렌더 중에 질의를 날린다.
      # 마이그레이션을 빌드 뒤에 두었더니 테이블이 없어 빌드가 죽었다.
      #
      # 시드까지 여기서 하는 이유는 프리렌더 결과에 카테고리가 실려야 하기
      # 때문이다. 빈 DB 로 빌드하면 통과는 하지만 푸터가 빈 화면이 구워진다.
      - name: DB 준비
        run: |
          # **먼저 Prisma 클라이언트를 만든다.**
          #
          # 시드가 그것을 임포트한다. 예전에는 turbo 가 lint 를 돌리며
          # ^build 로 함께 생성해 줬는데, DB 준비를 검사 앞으로 옮기면서
          # 그 순서가 끊겼다. 생성물은 저장소에 넣지 않으므로 CI 에는 없다.
          pnpm --filter @shop/db run generate
          pnpm --filter @shop/db exec prisma migrate deploy
          pnpm --filter @shop/db run seed
          pnpm --filter @shop/auth run seed
        # DATABASE_URL·BETTER_AUTH_SECRET 은 잡 전체 env 에서 온다.
        # 계정 시드는 로그인 API 를 거치므로 주소가 맞아야 한다.
        env:
          BETTER_AUTH_URL: http://localhost:3100

      # 린트를 먼저 돌린다. 가장 빠르고, 여기서 걸리는 것은 대개 가장 고치기 쉽다.
      - name: 의존성 권고
        # 지금 뜬 것으로 빨갛게 만들지 않는다. 목록에 없는 새 권고만 잡는다 —
        # tooling/audit.mjs 와 audit-allow.json 참고.
        run: pnpm audit:ci

      - name: 린트
        run: pnpm turbo run lint

      - name: 타입체크
        run: pnpm turbo run typecheck

      # 빌드가 먼저다 — client-dictionary 검사가 .next/static/chunks 를 본다.
      # 검사를 먼저 돌리면 그 검사는 조용히 건너뛴다. test/ci-order.test.ts 참고.
      - name: 빌드
        run: pnpm turbo run build

      - name: 테스트
        run: pnpm turbo run test

      # E2E 는 브라우저와 DB 가 있어야 돈다. 단위 테스트가 다 끝난 뒤에
      # 돌려서, 빠르고 값싼 검사가 먼저 걸리게 한다.
      - name: Playwright 브라우저 설치
        run: pnpm --filter @shop/web exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm turbo run e2e

      - name: E2E 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
