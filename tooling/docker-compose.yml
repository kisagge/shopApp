services:
  postgres:
    image: postgres:18-alpine
    container_name: shop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18부터 데이터 디렉토리 규약이 바뀌었다. /var/lib/postgresql/data 가
      # 아니라 상위 디렉토리를 마운트해야 pg_upgrade --link 가 마운트 경계를 넘지 않는다.
      # https://github.com/docker-library/postgres/pull/1259
      - shop-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: shop-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: shop
      MINIO_ROOT_PASSWORD: shopshop
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - shop-minio:/data

volumes:
  shop-pgdata:
  shop-minio:
