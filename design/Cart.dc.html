<x-dc>

    h1, h2, h3, h4, p, figure, blockquote { margin: 0; }

    button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; text-align: inherit; }
    table { border-collapse: collapse; width: 100%; }

    :where(a, button, [tabindex]):focus-visible { outline: 2px solid #181613; outline-offset: 2px; border-radius: 2px; }

    .hide-sb::-webkit-scrollbar { display: none; }

<div style="width: 375px; background: #FEFDFC; display: flex; flex-direction: column; min-height: 812px;">
